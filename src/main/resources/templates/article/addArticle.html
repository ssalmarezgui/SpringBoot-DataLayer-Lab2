<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Add Article</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">
</head>
<body>
    <div class="container my-5">
        <h3>Add Article</h3>
        <div class="card">
            <div class="card-body">
                <div class="col-md-10">
                    <form th:action="@{/articles/add}" th:object="${article}" method="post" enctype="multipart/form-data">
                        <div class="row">
                            <div class="form-group col-md-8">
                                <label for="label" class="col-form-label">Label</label> 
                                <input type="text" th:field="*{label}" class="form-control" id="label" placeholder="Label" required/> 
                                <span th:if="${#fields.hasErrors('label')}" th:errors="*{label}" class="text-danger"></span>
                            </div>

                            <div class="form-group col-md-8">
                                <label for="price" class="col-form-label">Price (DT)</label> 
                                <input type="number" step="0.1" th:field="*{price}" class="form-control" id="price" placeholder="Price" /> 
                                <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-danger"></span>
                            </div>
                            
							<!-- Correction pour que ce champs et pour l'upload des images' -->
                            <div class="form-group col-md-8">
                                <label class="col-form-label">Picture</label>
                                <input class="form-control" type="file" name="imageFile" accept="image/*" required>
                            </div>
                            
                            <!-- PDFFFF -->
                            <div class="form-group col-md-8">
							    <label class="col-form-label">PDF</label>
							    <input class="form-control" type="file" name="pdfFile" accept=".pdf" required>
							</div>
                            
                            <!-- EXCEEEL -->
                            <div class="form-group col-md-8">
							    <label class="col-form-label">Fichier Excel</label>
							    <input class="form-control" type="file" name="excelFile" accept=".xlsx, .xls" required>
							</div>

                            <div class="form-group col-md-8">
                                <label class="col-form-label">Provider</label>
                                <select name="providerId" class="form-control" required>
                                    <option value="">-- Select Provider --</option>
                                    <option th:each="pr : ${providers}" th:value="${pr.id}" th:text="${pr.name}"></option>
                                </select>
                            </div>

                            <div class="col-md-6 mt-3">
                                <input type="submit" class="btn btn-primary" value="Add Article" />
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
