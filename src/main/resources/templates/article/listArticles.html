<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Articles</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">
    <script src="https://code.jquery.com/jquery-1.9.1.min.js"></script>
    <script>
        $(document).on("click", ".btn-danger", function () {
            $('#deleteArticleModal').modal('show');
            var clickedBtn = $(this);
            $('#finalDelete').click(function(){
                window.location = '/articles/delete/' + clickedBtn.attr('value');
            });
        });
    </script>
</head>
<body>
    <!-- Modal -->
    <div class="modal fade" id="deleteArticleModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Delete an article</h5>
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                </div>
                <div class="modal-body">
                    <i class="fa fa-trash"></i> Are you sure you want to delete this article?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="button" id="finalDelete" class="btn btn-danger">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <h2 class="text-center my-4">List of Articles</h2>
    <div class="container my-2">
        <div class="card">
            <div class="card-body">
                <div th:switch="${articles}" class="container my-5">
                    <p class="my-3">
                        <a th:href="@{'/articles/add'}" class="btn btn-primary">
                            <i class="fas fa-user-plus ml-2"> Add Article</i>
                        </a>
                    </p>
                    <div class="col-md-12">
                        <h2 th:case="null">No Articles yet!</h2>
                        <div th:case="*">
                            <table class="table table-striped table-responsive-md">
                                <thead>
                                    <tr>
                                        <th>Label</th>
                                        <th>Price</th>
                                        <th>Provider</th>
                                        <th>Picture</th>
                                        <th>PDF</th>
										<th>Excel</th>
                                        <th>Edit</th>
                                        <th>Delete</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="article : ${articles}">
                                        <td th:text="${article.label}"></td>
                                        <td th:text="${article.price} + ' DT'"></td>
                                        <td th:text="${article.provider.name}"></td>
                                        <td>
                                            <img th:if="${article.picture != null}" 
                                                 th:src="@{'/uploadArticles/' + ${article.picture}}" 
                                                 width="60" height="60" style="object-fit:cover; border-radius:5px;"/>
                                        </td>
                                        <!-- Lien vers le PDF -->
                                        <td>
                                            <a th:if="${article.pdfFile != null and article.pdfFile != ''}" 
                                               th:href="@{'/uploadArticles/' + ${article.pdfFile}}" 
                                               target="_blank" class="btn btn-sm btn-outline-danger">
                                               <i class="fas fa-file-pdf"></i> View PDF
                                            </a>
                                            <span th:unless="${article.pdfFile != null and article.pdfFile != ''}" class="text-muted small">None</span>
                                        </td>	
										<!-- Lien vers le fichier Excel -->
										<td>
                                            <a th:if="${article.excelFile != null and article.excelFile != ''}" 
                                               th:href="@{'/uploadArticles/' + ${article.excelFile}}" 
                                               download class="btn btn-sm btn-outline-success">
                                               <i class="fas fa-file-excel"></i> Download
                                            </a>
                                            <span th:unless="${article.excelFile != null and article.excelFile != ''}" class="text-muted small">None</span>
                                        </td>
                                        <td>
                                            <a th:href="@{/articles/edit/{id}(id=${article.id})}" class="btn btn-warning">
                                                <i class="fa fa-edit"></i>
                                            </a>
                                        </td>
                                        <td>
                                            <a th:value="${article.id}" class="btn btn-danger text-white">
                                                <i class="fa fa-trash"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"></script>
</body>
</html>
