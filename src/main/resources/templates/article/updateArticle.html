<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Update Article</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">
</head>
<body>
    <div class="container my-5">
        <h3 class="text-center">Update Article</h3>
        <div class="card">
            <div class="card-body">
                <div class="col-md-8">
                    <form th:action="@{/articles/edit}" th:object="${article}" method="post" enctype="multipart/form-data">
                        
                        <input type="hidden" th:field="*{id}" />
                        <input type="hidden" th:field="*{picture}" />
                        <input type="hidden" th:field="*{pdfFile}" />
                        <input type="hidden" th:field="*{excelFile}" />

                        <div class="row">
                            <div class="form-group col-md-8">
                                <label for="label" class="col-form-label">Label</label> 
                                <input type="text" th:field="*{label}" class="form-control" id="label" /> 
                                <span th:if="${#fields.hasErrors('label')}" th:errors="*{label}" class="text-danger"></span>
                            </div>

                            <div class="form-group col-md-8">
                                <label for="price" class="col-form-label">Price (DT)</label> 
                                <input type="number" step="0.1" th:field="*{price}" class="form-control" id="price" /> 
                                <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-danger"></span>
                            </div>

                            <!-- Picture -->
							<div class="form-group col-md-8">
							    <label class="col-form-label">Current picture</label><br/>
							    <div th:if="${article.picture != null and article.picture != ''}">
							        <img alt="Current Image" th:src="@{'/uploadArticles/' + ${article.picture}}" width="180" height="180" style="object-fit:cover; border-radius:8px;"/><br/><br/>
							    </div>
							    <label class="col-form-label">Update picture</label> 
							    <input class="form-control" type="file" name="newImageFile" accept="image/*">
							</div>
							
							<!-- PDF File -->
							<div class="form-group col-md-8">
							    <label class="col-form-label">Current PDF quotation</label><br/>
							    <div th:if="${article.pdfFile != null and article.pdfFile != ''}">
							        <a th:href="@{'/uploadArticles/' + ${article.pdfFile}}" target="_blank" class="btn btn-sm btn-outline-danger">
							            <i class="fas fa-file-pdf"></i> View Current PDF
							        </a><br/><br/>
							    </div>
							    <label class="col-form-label">Update PDF</label> 
							    <input class="form-control" type="file" name="newPdfFile" accept=".pdf">
							</div>
							
							<!-- Excel File -->
							<div class="form-group col-md-8">
							    <label class="col-form-label">Current Excel sheet</label><br/>
							    <div th:if="${article.excelFile != null and article.excelFile != ''}">
							        <a th:href="@{'/uploadArticles/' + ${article.excelFile}}" download class="btn btn-sm btn-outline-success">
							            <i class="fas fa-file-excel"></i> Download Current Excel
							        </a><br/><br/>
							    </div>
							    <label class="col-form-label">Update Excel sheet</label> 
							    <input class="form-control" type="file" name="newExcelFile" accept=".xlsx, .xls">
							</div>
                            

                            <div class="form-group col-md-8">
                                <label class="col-form-label">Select Provider</label>
                                <select name="providerId" class="form-control" required>
                                    <option th:each="pr: ${providers}" 
                                            th:value="${pr.id}" 
                                            th:text="${pr.name}" 
                                            th:selected="${article.provider != null and pr.id == article.provider.id}">
                                    </option>
                                </select>
                            </div>

                            <div class="form-group col-md-8 mt-3">
                                <input type="submit" class="btn btn-primary" value="Update Article">
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
