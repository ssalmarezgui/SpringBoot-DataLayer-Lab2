<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Update Provider</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" 
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" 
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" 
          crossorigin="anonymous">
          
    <!-- Font Awesome -->
    <link rel="stylesheet" 
          href="https://use.fontawesome.com/releases/v5.4.1/css/all.css" 
          integrity="sha384-5sAR7xN1Nv6T6+dT2mhtzEpVJvfS3NScPQTrOxhwjIuvcA67KV2R5Jz6kr4abQsz" 
          crossorigin="anonymous">
</head>
<body>
    <div class="container my-5">
        <h3>Update Provider</h3>
        <div class="card">
            <div class="card-body">
                <div class="col-md-8">
                    <form action="#" th:action="@{/providers/update}" th:object="${provider}" method="post" enctype="multipart/form-data">
                        
                        <!-- Champ ID caché indispensable pour la mise à jour -->
                        <input type="hidden" th:field="*{id}" />
                        <input type="hidden" th:field="*{invoiceFile}" />
                        

                        <div class="row">
                            <!-- Champ Name -->
                            <div class="form-group col-md-6">
                                <label for="name" class="col-form-label">Name</label>
                                <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Name">
                                <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></span>
                            </div>

                            <!-- Champ Email -->
                            <div class="form-group col-md-8">
                                <label for="email" class="col-form-label">Email</label>
                                <input type="text" th:field="*{email}" class="form-control" id="email" placeholder="Email">
                                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></span>
                            </div>

                            <!-- Champ Address -->
                            <div class="form-group col-md-8">
                                <label for="address" class="col-form-label">Address</label>
                                <input type="text" th:field="*{address}" class="form-control" id="address" placeholder="Address">
                                <span th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="text-danger"></span>
                            </div>
                            
                            <div class="form-group col-md-8">
							    <label class="col-form-label font-weight-bold">Current Invoice / Accreditation</label><br/>
							    <div th:if="${provider.invoiceFile != null and provider.invoiceFile != ''}">
							        <a th:href="@{'/uploadArticles/' + ${provider.invoiceFile}}" target="_blank" class="btn btn-sm btn-outline-info">
							            View Current File
							        </a><br/><br/>
							    </div>
							    <span th:unless="${provider.invoiceFile != null and provider.invoiceFile != ''}" class="text-muted small">None</span><br/>
							
							    <label class="col-form-label">Update Invoice / Accreditation (PDF or Excel)</label>
							    <input class="form-control" type="file" name="newInvoiceFile" accept=".pdf, .xlsx, .xls">
							</div>
                            

                            <!-- Bouton Submit -->
                            <div class="form-group col-md-8">
                                <input type="submit" class="btn btn-primary" value="Update Provider">
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
